<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LRCI Transmittal</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 25px; background-color: #121212; color: #e0e0e0; max-width: 950px; margin: 30px auto 0; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border-radius: 8px; background: #1a1a1a; }
    h3 { color: #ffcc00; border-bottom: 2px solid #ffcc00; padding-bottom: 8px; margin: 0; text-align: center; }
    .subtitle { text-align: center; color: #888; font-size: 14px; margin: -5px 0 20px; text-transform: uppercase; letter-spacing: 1px;}
    .meta-section { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; background: #262626; padding: 15px; border-radius: 6px; border: 1px solid #333; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #ffcc00; }
    input, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #444; border-radius: 4px; font-size: 13px; background-color: #2b2b2b; color: #ffffff; }
    input:focus, select:focus { border-color: #ffcc00; outline: none; box-shadow: 0 0 0 3px rgba(255,204,0,0.2); }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { background-color: #ffcc00; color: #121212; padding: 10px; font-size: 12px; border: 1px solid #ffcc00; }
    td { padding: 6px; border: 1px solid #333; background-color: #222; }
    .item-title { margin: 20px 0 8px; color: #ffcc00; font-weight: bold; font-size: 14px; border-left: 4px solid #ffcc00; padding-left: 8px; }
    .item-field-container { display: flex; gap: 4px; align-items: center; }
    .item-field-container input { flex: 1; }
    .item-field-container select { width: 110px; font-size: 11px; padding: 7px 4px; background: #333; border-color: #444; color: #ffcc00; font-weight: 600; }
    .btn-add { background-color: #ffcc00; color: #121212; border: none; padding: 10px 20px; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 15px; }
    .btn-add:hover { background-color: #e6b800; }
    .btn-submit { width: 100%; background-color: #ffcc00; color: #121212; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 25px; }
    .btn-submit:hover { background-color: #e6b800; }
    .btn-submit:disabled { background-color: #555; color: #888; cursor: not-allowed; }
    #result { margin-top: 20px; padding: 15px; border-radius: 4px; display: none; text-align: center; font-weight: bold; }
    .success-link { background-color: #2f855a; color: white; padding: 12px; display: block; text-decoration: none; border-radius: 4px; font-weight: bold; margin-top: 10px; font-size: 14px; text-transform: uppercase; }
    .success-link:hover { background-color: #276749; }
    .btn-delete { background-color: #e53e3e; color: white; border: none; padding: 6px 10px; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; display: block; margin: 0 auto; }
    .btn-delete:hover { background-color: #c53030; }
  </style>
</head>
<body>
  <h3>LRCI – MEYCAUYAN BRANCH (EDP)</h3>
  <div class="subtitle">Transmittal Portal</div>
  <div class="meta-section">
    <div class="form-group"><label>PO NUMBER:</label><input type="text" id="poNum" placeholder="PO#"></div>
    <div class="form-group"><label>DATE:</label><input type="date" id="dateField"></div>
    <div class="form-group"><label>FROM:</label><input type="text" id="fromField" placeholder="FROM"></div>
    <div class="form-group"><label>TO:</label><input type="text" id="toField" placeholder="TO"></div>
    <div class="form-group"><label>C/O:</label><input type="text" id="coField" placeholder="C/O"></div>
    <div class="form-group"><label>PREPARED BY:</label>
      <select id="preparedBy">
        <option value="" selected disabled>-- SELECT NAME --</option>
        <option value="JM EDP MEYCAUYAN">JM EDP MEYCAUYAN</option>
        <option value="RAFFY EDP MEYCAUYAN">RAFFY EDP MEYCAUYAN</option>
      </select>
    </div>
  </div>
  <div class="item-title">📋 LISTAHAN NG MGA ITEMS</div>
  <table>
    <thead><tr><th>USER</th><th style="width:10%;">QTY</th><th style="width:40%;">ITEM NAME *</th><th>SERIAL</th><th>REMARKS</th><th></th></tr></thead>
    <tbody id="itemsContainer">
      <tr class="item-row">
        <td><input type="text" class="input-user" placeholder="User"></td>
        <td><input type="number" class="input-qty" min="1" value="1"></td>
        <td>
          <div class="item-field-container">
            <input type="text" class="input-item" placeholder="Type here...">
            <select onchange="pickItem(this)">
              <option value="" selected disabled>📋 Picker</option>
              <option value="System Unit (SERVER i3)">System Unit</option>
              <option value="Computer Set">Computer Set</option>
              <option value="Monitor">Monitor</option>
              <option value="UPS (APC)">UPS (APC)</option>
            </select>
          </div>
        </td>
        <td><input type="text" class="input-serial" placeholder="Serial"></td>
        <td><input type="text" class="input-remarks" placeholder="Remarks"></td>
        <td><button type="button" class="btn-delete" onclick="deleteRow(this)">❌</button></td>
      </tr>
    </tbody>
  </table>
  <button type="button" class="btn-add" onclick="addNewRow()">➕ ADD ROW</button>
  <button type="button" id="btnSubmit" class="btn-submit" onclick="submitForm()">GUMAWA AT I-GENERATE ANG TRANSMITTAL</button>
  <div id="result"></div>

        <script>
      // ⚠️ I-PASTE MO DITO ANG IYONG GOOGLE APPS SCRIPT WEB APP URL (Yung nagtatapos sa /exec)
      const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycby2VvhPb-VJ1FhLn_4uu9DYoJmu2x_HAdhjliOLKkRML9QEijbpS7_xUwdWyafv3yg/exec";

      function pickItem(selectObj) {
        if (selectObj.value) {
          selectObj.parentElement.querySelector(".input-item").value = selectObj.value;
          selectObj.value = ""; 
        }
      }

      // Ligtas na add row: Hindi na kailangan ng cloneNode o id="defaultRow" kaya hindi na mag-e-error!
      function addNewRow() {
        var tbody = document.getElementById("itemsContainer");
        var tr = document.createElement("tr");
        tr.className = "item-row";
        tr.innerHTML = '<td><input type="text" class="input-user" placeholder="User"></td>' +
                     '<td><input type="number" class="input-qty" placeholder="1" min="1" value="1"></td>' +
                     '<td><div class="item-field-container">' +
                     '<input type="text" class="input-item" placeholder="Type here...">' +
                     '<select onchange="pickItem(this)">' +
                     '<option value="" selected disabled>📋 Picker</option>' +
                     '<option value="System Unit (SERVER i3)">System Unit (SERVER i3)</option>' +
                     '<option value="Computer Set (System unit (Station), Monitor, Keyboard & Mouse, Avr)">Computer Set</option>' +
                     '<option value="System Unit (Station)">System Unit (Station)</option>' +
                     '<option value="Monitor">Monitor</option>' +
                     '<option value="UPS (APC)">UPS (APC)</option>' +
                     '<option value="Webcam Inplay">Webcam Inplay</option>' +
                     '<option value="Switch Hub Tplink 8 Ports">Switch Hub Tplink 8 Ports</option>' +
                     '<option value="Printer Epson L21">Printer Epson L21</option>' +
                     '</select></div></td>' +
                     '<td><input type="text" class="input-serial" placeholder="Serial No."></td>' +
                     '<td><input type="text" class="input-remarks" placeholder="Remarks"></td>' +
                     '<td><button type="button" class="btn-delete" onclick="deleteRow(this)">❌</button></td>';
        tbody.appendChild(tr);
      }

      function deleteRow(button) {
        var tbody = document.getElementById("itemsContainer");
        if (tbody.querySelectorAll(".item-row").length > 1) {
          tbody.removeChild(button.closest(".item-row"));
        } else {
          var inputs = button.closest(".item-row").querySelectorAll("input");
          inputs.forEach(function(input) {
            input.value = input.classList.contains("input-qty") ? "1" : "";
          });
        }
      }

      function submitForm() {
        var btn = document.getElementById("btnSubmit");
        var resultDiv = document.getElementById("result");
        var preparedByVal = document.getElementById("preparedBy").value;

        if (!preparedByVal) {
          resultDiv.style.display = "block";
          resultDiv.style.backgroundColor = "#ffdbdb";
          resultDiv.style.color = "#c53030";
          resultDiv.innerHTML = "⚠️ Mangyaring pumili muna ng pangalan sa PREPARED BY.";
          return;
        }
        
        var itemsData = [];
        var rows = document.querySelectorAll(".item-row");
        rows.forEach(function(row) {
          var itemVal = row.querySelector(".input-item").value;
          if (itemVal && itemVal.trim() !== "") {
            itemsData.push({
              user: row.querySelector(".input-user").value || "",
              qty: row.querySelector(".input-qty").value || "1",
              item: itemVal.trim(),
              serial: row.querySelector(".input-serial").value || "",
              remarks: row.querySelector(".input-remarks").value || ""
            });
          }
        });
        
        btn.disabled = true;
        btn.style.backgroundColor = "#555555";
        btn.style.color = "#888888";
        resultDiv.style.display = "block";
        resultDiv.style.backgroundColor = "#fff3cd";
        resultDiv.style.color = "#856404";
        resultDiv.innerHTML = "⏳ Ginagawa ang Transmittal Form... Pakihintay...";
        
        var formData = {
          poNum: document.getElementById("poNum").value,
          fromField: document.getElementById("fromField").value,
          toField: document.getElementById("toField").value,
          coField: document.getElementById("coField").value,
          dateField: document.getElementById("dateField").value,
          preparedBy: preparedByVal,
          itemsJson: JSON.stringify(itemsData)
        };

        fetch(GAS_WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify(formData),
          headers: { "Content-Type": "text/plain;charset=utf-8" }
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          btn.disabled = false;
          btn.style.backgroundColor = "#ffcc00";
          btn.style.color = "#121212";
          if (data.status === "success" && data.url) {
            resultDiv.style.backgroundColor = "#d4edda";
            resultDiv.style.color = "#155724";
            resultDiv.innerHTML = '🎉 Tagumpay! Nalikha ang iyong Transmittal.<br><a class="success-link" href="' + data.url + '" target="_blank">📄 BUKSAN ANG TRANSMITTAL DOCUMENT</a>';
          } else {
            throw new Error(data.message || "Hindi maibalik ang transmittal download URL.");
          }
        })
        .catch(function(err) {
          btn.disabled = false;
          btn.style.backgroundColor = "#ffcc00";
          btn.style.color = "#121212";
          resultDiv.style.backgroundColor = "#f8d7da";
          resultDiv.style.color = "#721c24";
          resultDiv.innerHTML = "❌ Nagka-error: " + err.message;
        });
      }
    </script>


</body>
</html>
