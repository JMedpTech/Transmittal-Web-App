<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>LRCI Transmittal Web App</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 25px; background-color: #121212; color: #e0e0e0; max-width: 950px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border-radius: 8px; margin-top: 30px; background: #1a1a1a; }
      h3 { color: #ffcc00; border-bottom: 2px solid #ffcc00; padding-bottom: 8px; margin-top: 0; text-align: center; }
      .meta-section { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; background: #262626; padding: 15px; border-radius: 6px; border: 1px solid #333; }
      .form-group { margin-bottom: 12px; }
      label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #ffcc00; }
      input[type="text"], input[type="date"], input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #444; border-radius: 4px; font-size: 13px; background-color: #2b2b2b; color: #ffffff; }
      input:focus { border-color: #ffcc00; outline: none; box-shadow: 0 0 0 3px rgba(255,204,0,0.2); }
      table { width: 100%; border-collapse: collapse; margin-top: 10px; }
      th { background-color: #ffcc00; color: #121212; padding: 10px; font-size: 12px; border: 1px solid #ffcc00; }
      td { padding: 6px; border: 1px solid #333; background-color: #222; }
      .item-title { margin-top: 20px; margin-bottom: 8px; color: #ffcc00; font-weight: bold; font-size: 14px; border-left: 4px solid #ffcc00; padding-left: 8px; }
      .btn-add { background-color: #444; color: #ffcc00; border: 1px solid #ffcc00; padding: 8px 15px; font-size: 13px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; }
      .btn-add:hover { background-color: #ffcc00; color: #121212; }
      .btn-submit { width: 100%; background-color: #ffcc00; color: #121212; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 25px; }
      .btn-submit:hover { background-color: #e6b800; }
      .btn-submit:disabled { background-color: #555; color: #888; cursor: not-allowed; }
      #status { text-align: center; margin-top: 15px; font-weight: bold; font-size: 14px; }
      .success-link { color: #00ffcc; text-decoration: underline; font-size: 16px; }
    </style>
  </head>
  <body>

    <h3>LRCI TRANSMITTAL WEB APP (GITHUB EDITION)</h3>
    
    <form id="transmittalForm" onsubmit="submitForm(event)">
      <div class="meta-section">
        <div class="form-group"><label>PO NUMBER</label><input type="text" id="poNum" required placeholder="Gaya ng PO-2026-001"></div>
        <div class="form-group"><label>DATE</label><input type="date" id="dateField" required></div>
        <div class="form-group"><label>FROM</label><input type="text" id="fromField" required placeholder="EDP Dept"></div>
        <div class="form-group"><label>TO</label><input type="text" id="toField" required placeholder="Accounting / Branch Name"></div>
        <div class="form-group"><label>C/O (CARE OF)</label><input type="text" id="coField" placeholder="Pangalan ng magdadala"></div>
        <div class="form-group"><label>PREPARED BY</label><input type="text" id="preparedBy" required placeholder="Iyong Pangalan"></div>
      </div>

      <div class="item-title">TRANSMITTAL ITEMS</div>
      <table id="itemsTable">
        <thead>
          <tr>
            <th>USER</th>
            <th style="width: 70px;">QTY</th>
            <th>ITEM</th>
            <th>SERIAL</th>
            <th>REMARKS</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td><input type="text" class="row-user"></td>
            <td><input type="number" class="row-qty" min="1" value="1"></td>
            <td><input type="text" class="row-item"></td>
            <td><input type="text" class="row-serial"></td>
            <td><input type="text" class="row-remarks"></td>
          </tr>
        </tbody>
      </table>

      <button type="button" class="btn-add" onclick="addRow()">+ MAGDAGDAG NG ROW</button>
      <button type="submit" id="submitBtn" class="btn-submit">IPROSESO AT GAWIN ANG TRANSMITTAL</button>
    </form>

    <div id="status"></div>

    <script>
      // PALITAN MO ITO NG IYONG GOOGLE APPS SCRIPT WEB APP URL MATAPOS MAG DEPLOY
      const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwptAnL-vnBd0w3AmzC1bZHlA9TESgE80tPuOYa8KMvw9NJHqsX1ULXdtDsDv3Miqk8/exec";

      function addRow() {
        var tbody = document.getElementById("tableBody");
        var tr = document.createElement("tr");
        tr.innerHTML = `
          <td><input type="text" class="row-user"></td>
          <td><input type="number" class="row-qty" min="1" value="1"></td>
          <td><input type="text" class="row-item"></td>
          <td><input type="text" class="row-serial"></td>
          <td><input type="text" class="row-remarks"></td>
        `;
        tbody.appendChild(tr);
      }

      function submitForm(event) {
        event.preventDefault();
        
        var submitBtn = document.getElementById("submitBtn");
        var statusDiv = document.getElementById("status");
        
        submitBtn.disabled = true;
        statusDiv.style.color = "#ffcc00";
        statusDiv.innerHTML = "Kinokolekta ang data at ginagawa ang Google Doc... Sandali lamang.";

        var itemsList = [];
        var rows = document.querySelectorAll("#tableBody tr");
        
        rows.forEach(function(row) {
          var itemVal = row.querySelector(".row-item").value;
          if(itemVal && itemVal.trim() !== "") {
            itemsList.push({
              user: row.querySelector(".row-user").value,
              qty: row.querySelector(".row-qty").value,
              item: itemVal,
              serial: row.querySelector(".row-serial").value,
              remarks: row.querySelector(".row-remarks").value
            });
          }
        });

        var formData = {
          poNum: document.getElementById("poNum").value,
          dateField: document.getElementById("dateField").value,
          fromField: document.getElementById("fromField").value,
          toField: document.getElementById("toField").value,
          coField: document.getElementById("coField").value,
          preparedBy: document.getElementById("preparedBy").value,
          itemsJson: JSON.stringify(itemsList)
        };

        // Gagamit ng Fetch API para ipadala ang data papunta sa Google Apps Script cross-domain
        fetch(GAS_WEB_APP_URL, {
          method: "POST",
          mode: "no-cors", // Kailangan ng no-cors para sa Google Redirects redirect mechanism
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(formData)
        })
        .then(response => {
          // Dahil no-cors ang mode, hindi natin mababasa ang direktang json response 
          // para sa URL para sa seguridad, ngunit alam nating gumana ito kung walang network crash.
          submitBtn.disabled = false;
          statusDiv.style.color = "#00ffcc";
          statusDiv.innerHTML = `<b>Tagumpay!</b> Naipadala ang data. Pakisuri ang iyong Google Drive para sa bagong gawang file ("Transmittal - PO ${formData.poNum}").`;
          document.getElementById("transmittalForm").reset();
          document.getElementById("tableBody").innerHTML = `
            <tr>
              <td><input type="text" class="row-user"></td>
              <td><input type="number" class="row-qty" min="1" value="1"></td>
              <td><input type="text" class="row-item"></td>
              <td><input type="text" class="row-serial"></td>
              <td><input type="text" class="row-remarks"></td>
            </tr>
          `;
        })
        .catch(error => {
          submitBtn.disabled = false;
          statusDiv.style.color = "#ff3333";
          statusDiv.innerHTML = "May naganap na error sa pagpapadala: " + error.message;
        });
      }
    </script>
  </body>
</html>
