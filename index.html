<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LRCI Transmittal Portal</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 25px; background-color: #121212; color: #e0e0e0; max-width: 950px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border-radius: 8px; margin-top: 30px; background: #1a1a1a; }
      h3 { color: #ffcc00; border-bottom: 2px solid #ffcc00; padding-bottom: 8px; margin-top: 0; text-align: center; }
      .meta-section { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; background: #262626; padding: 15px; border-radius: 6px; border: 1px solid #333; }
      .form-group { margin-bottom: 12px; }
      label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #ffcc00; }
      input[type="text"], input[type="date"], input[type="number"], select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #444; border-radius: 4px; font-size: 13px; background-color: #2b2b2b; color: #ffffff; }
      input:focus, select:focus { border-color: #ffcc00; outline: none; box-shadow: 0 0 0 3px rgba(255,204,0,0.2); }
      table { width: 100%; border-collapse: collapse; margin-top: 10px; }
      th { background-color: #ffcc00; color: #121212; padding: 10px; font-size: 12px; border: 1px solid #ffcc00; }
      td { padding: 6px; border: 1px solid #333; background-color: #222; }
      .item-title { margin-top: 20px; margin-bottom: 8px; color: #ffcc00; font-weight: bold; font-size: 14px; border-left: 4px solid #ffcc00; padding-left: 8px; }
      .item-field-container { display: flex; gap: 4px; align-items: center; }
      .item-field-container input { flex: 1; }
      .item-field-container select { width: 110px; font-size: 11px; padding: 7px 4px; background: #333; border-color: #444; cursor: pointer; color: #ffcc00; font-weight: 600; }
      .btn-add { background-color: #ffcc00; color: #121212; border: none; padding: 10px 20px; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 15px; }
      .btn-add:hover { background-color: #e6b800; }
      .btn-submit { width: 100%; background-color: #ffcc00; color: #121212; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 25px; }
      .btn-submit:hover { background-color: #e6b800; }
      #result { margin-top: 20px; padding: 15px; border-radius: 4px; display: none; text-align: center; font-weight: bold; }
      .btn-delete { background-color: #e53e3e; color: white; border: none; padding: 6px 10px; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; display: block; margin: 0 auto; }
      .btn-delete:hover { background-color: #c53030; }
    </style>
  </head>
  <body>
    <h3>LRCI – MEYCAUYAN BRANCH (EDP)</h3>
    <div style="text-align: center; color: #aaa; margin-top: -5px; margin-bottom: 20px; font-size: 14px; letter-spacing: 1px;">Transmittal Portal</div>
    
    <!-- Ginamitan ng totoong HTML Form para i-bypass ang restriction ng AJAX/Fetch sa GitHub -->
    <form id="transmittalForm" action="" method="GET" target="_blank">
      <div class="meta-section">
        <div class="form-group"><label>PO NUMBER:</label><input type="text" name="poNum" id="poNum" placeholder="PO#"></div>
        <div class="form-group"><label>DATE (Transmittal Created):</label><input type="date" name="dateField" id="dateField"></div>
        <div class="form-group"><label>FROM:</label><input type="text" name="fromField" id="fromField" placeholder="FROM"></div>
        <div class="form-group"><label>TO:</label><input type="text" name="toField" id="toField" placeholder="TO"></div>
        <div class="form-group"><label>C/O:</label><input type="text" name="coField" id="coField" placeholder="C/O"></div>
        <div class="form-group"><label>PREPARED BY:</label>
          <select name="preparedBy" id="preparedBy" required>
            <option value="" selected disabled>-- SELECT NAME --</option>
            <option value="JM EDP MEYCAUYAN">JM EDP MEYCAUYAN</option>
            <option value="RAFFY EDP MEYCAUYAN">RAFFY EDP MEYCAUYAN</option>
          </select>
        </div>
      </div>

      <!-- Hidden field para itago ang listahan ng items -->
      <input type="hidden" name="itemsJson" id="itemsJson">

      <div class="item-title">📋 LISTAHAN NG MGA ITEMS / GAMIT</div>
      <table>
        <thead>
          <tr>
            <th style="width: 20%;">USER</th>
            <th style="width: 10%;">QTY</th>
            <th style="width: 35%;">ITEM NAME (Type or Use Picker) *</th>
            <th style="width: 17%;">SERIAL</th>
            <th style="width: 13%;">REMARKS</th>
            <th style="width: 5%;"></th>
          </tr>
        </thead>
        <tbody id="itemsContainer">
          <tr class="item-row" id="defaultRow">
            <td><input type="text" class="input-user" placeholder="User"></td>
            <td><input type="number" class="input-qty" value="1" min="1"></td>
            <td>
              <div class="item-field-container">
                <input type="text" class="input-item" placeholder="Type here...">
                <select onchange="pickItem(this)">
                  <option value="" selected disabled>📋 Picker</option>
                  <option value="System Unit (SERVER i3)">System Unit (SERVER i3)</option>
                  <option value="Computer Set (System unit (Station), Monitor, Keyboard & Mouse, Avr)">Computer Set</option>
                  <option value="System Unit (Station)">System Unit (Station)</option>
                  <option value="Monitor">Monitor</option>
                  <option value="UPS (APC)">UPS (APC)</option>
                  <option value="Webcam Inplay">Webcam Inplay</option>
                  <option value="Switch Hub Tplink 8 Ports">Switch Hub Tplink 8 Ports</option>
                  <option value="Printer Epson L21">Printer Epson L21</option>
                </select>
              </div>
            </td>
            <td><input type="text" class="input-serial" placeholder="Serial No."></td>
            <td><input type="text" class="input-remarks" placeholder="Remarks"></td>
            <td><button type="button" class="btn-delete" onclick="deleteRow(this)">❌</button></td>
          </tr>
        </tbody>
      </table>
      
      <button type="button" class="btn-add" onclick="addNewRow()">➕ ADD ROW</button>
      <button type="button" id="btnSubmit" class="btn-submit" onclick="submitForm()">GUMAWA AT I-GENERATE ANG TRANSMITTAL</button>
    </form>
    
    <div id="result"></div>

    <script>
      // ⚠️ IMPORTANT: I-PASTE DITO ANG CURRENT WEB APP URL NA GALING SA IYONG APPS SCRIPT DEPLOYMENT
      const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx20-OXayi9B6ydghD21q52hIPKgDLXFKYaZZix-DjiwqkmuIydBNyLk1Z45TFNXzue/exec";

      function pickItem(selectObj) {
        if (selectObj.value) {
          var container = selectObj.closest(".item-field-container") || selectObj.parentElement;
          container.querySelector(".input-item").value = selectObj.value;
          selectObj.value = ""; 
        }
      }

      function addNewRow() {
        var tbody = document.getElementById("itemsContainer");
        var baseRow = document.getElementById("defaultRow");
        if (!baseRow) return;
        
        var clone = baseRow.cloneNode(true);
        clone.removeAttribute("id");
        
        var inputs = clone.querySelectorAll("input");
        inputs.forEach(function(input) {
          if (input.classList.contains("input-qty")) {
            input.value = "1";
          } else {
            input.value = "";
          }
        });
        tbody.appendChild(clone);
      }

      function deleteRow(button) {
        var row = button.closest("tr") || button.parentNode.parentNode;
        var tbody = document.getElementById("itemsContainer");
        if (tbody.rows.length > 1) {
          tbody.removeChild(row);
        } else {
          var inputs = row.querySelectorAll("input");
          inputs.forEach(function(input) { input.value = ""; });
        }
      }

      function submitForm() {
        var form = document.getElementById("transmittalForm");
        var resultDiv = document.getElementById("result");
        var preparedByVal = document.getElementById("preparedBy").value;

        if (!preparedByVal) {
          resultDiv.style.display = "block";
          resultDiv.style.backgroundColor = "#ffdbdb";
          resultDiv.style.color = "#c53030";
          resultDiv.innerHTML = "⚠️ Mangyaring pumili muna ng pangalan sa PREPARED BY.";
          return;
        }
        
        var itemsData = [];
        var rows = document.querySelectorAll(".item-row");
        rows.forEach(function(row) {
          var itemVal = row.querySelector(".input-item").value;
          if (itemVal && itemVal.trim() !== "") {
            itemsData.push({
              user: row.querySelector(".input-user").value || "",
              qty: row.querySelector(".input-qty").value || "1",
              item: itemVal.trim(),
              serial: row.querySelector(".input-serial").value || "",
              remarks: row.querySelector(".input-remarks").value || ""
            });
          }
        });

        // I-encode ang talahanayan sa hidden element bago i-submit
        document.getElementById("itemsJson").value = JSON.stringify(itemsData);

        // Awtomatikong buksan ang Google Script Tab para doon i-process ang document creation nang walang CORS error
        form.action = APPS_SCRIPT_URL;
        form.submit();

        resultDiv.style.display = "block";
        resultDiv.style.backgroundColor = "#d4edda";
        resultDiv.style.color = "#155724";
        resultDiv.innerHTML = "⏳ Ipinapadala ang transmittal data... Nagbubukas ng bagong window para sa Google Docs Link.";
      }
    </script>
  </body>
</html>
