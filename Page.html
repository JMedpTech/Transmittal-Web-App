<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LRCI Transmittal Web App</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 25px; background-color: #121212; color: #e0e0e0; max-width: 950px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border-radius: 8px; margin-top: 30px; background: #1a1a1a; box-sizing: border-box; }
      h3 { color: #ffcc00; border-bottom: 2px solid #ffcc00; padding-bottom: 8px; margin-top: 0; text-align: center; }
      .meta-section { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; background: #262626; padding: 15px; border-radius: 6px; border: 1px solid #333; }
      .form-group { margin-bottom: 12px; }
      label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #ffcc00; }
      input[type="text"], input[type="date"], input[type="number"], select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #444; border-radius: 4px; font-size: 13px; background-color: #2b2b2b; color: #ffffff; }
      input:focus, select:focus { border-color: #ffcc00; outline: none; box-shadow: 0 0 0 3px rgba(255,204,0,0.2); }
      
      /* Wrapper para maging responsive ang table sa CP */
      .table-responsive { width: 100%; overflow-x: auto; margin-top: 10px; }
      table { width: 100%; border-collapse: collapse; min-width: 600px; }
      th { background-color: #ffcc00; color: #121212; padding: 10px; font-size: 12px; border: 1px solid #ffcc00; text-transform: uppercase; }
      td { padding: 6px; border: 1px solid #333; background-color: #222; }
      
      .item-title { margin-top: 20px; margin-bottom: 8px; color: #ffcc00; font-weight: bold; font-size: 14px; border-left: 4px solid #ffcc00; padding-left: 8px; }
      .item-field-container { display: flex; gap: 4px; align-items: center; }
      .item-field-container input { flex: 1; }
      
      .btn-add { background-color: #ffcc00; color: #121212; border: none; padding: 10px 20px; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 15px; text-transform: uppercase; }
      .btn-add:hover { background-color: #e6b800; }
      
      .btn-submit { width: 100%; background-color: #ffcc00; color: #121212; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 25px; text-transform: uppercase; }
      .btn-submit:hover { background-color: #e6b800; }
      .btn-submit:disabled { background-color: #555; color: #aaa; cursor: not-allowed; }
      
      .status-msg { margin-top: 20px; padding: 15px; border-radius: 6px; text-align: center; font-weight: bold; display: none; }
      .success { background-color: #1b4332; color: #75e6da; border: 1px solid #2d6a4f; }
      .error { background-color: #4c1d1d; color: #ff8b8b; border: 1px solid #7a2828; }
      .success a { color: #ffcc00; font-weight: bold; text-decoration: underline; }

      @media (max-width: 600px) {
        .meta-section { grid-template-columns: 1fr; gap: 10px; }
      }
    </style>
  </head>
<body>

  <div class="container">
    <h3>LRCI Transmittal Portal System</h3>
    
    <form id="transmittalForm" onsubmit="submitForm(event)">
      <!-- Meta Information Section -->
      <div class="meta-section">
        <div class="form-group">
          <label>PO Number:</label>
          <input type="text" id="poNum" placeholder="e.g. 14872" required>
        </div>
        <div class="form-group">
          <label>Date:</label>
          <input type="date" id="dateField" required>
        </div>
        <div class="form-group">
          <label>From:</label>
          <input type="text" id="fromField" placeholder="e.g. EDP Meycauayan" required>
        </div>
        <div class="form-group">
          <label>To:</label>
          <input type="text" id="toField" placeholder="e.g. Accounting Dept" required>
        </div>
        <div class="form-group">
          <label>C/O:</label>
          <input type="text" id="coField" placeholder="e.g. Sir Juan">
        </div>
        <div class="form-group">
          <label>Prepared By:</label>
          <input type="text" id="preparedBy" placeholder="Your Name" required>
        </div>
      </div>

      <!-- Items Table Section -->
      <div class="item-title">Itemized Logistics Assets</div>
      <div class="table-responsive">
        <table id="itemsTable">
          <thead>
            <tr>
              <th>User / Branch</th>
              <th>Qty</th>
              <th>Item Description</th>
              <th>Serial Number</th>
              <th>Remarks</th>
            </tr>
          </thead>
          <tbody>
            <!-- Pre-load with 3 blank rows for clean user experience -->
            <tr>
              <td><input type="text" class="row-user" placeholder="User"></td>
              <td><input type="number" class="row-qty" placeholder="1" value="1"></td>
              <td><input type="text" class="row-item" placeholder="Item Name"></td>
              <td><input type="text" class="row-serial" placeholder="S/N"></td>
              <td><input type="text" class="row-remarks" placeholder="Remarks"></td>
            </tr>
            <tr>
              <td><input type="text" class="row-user" placeholder="User"></td>
              <td><input type="number" class="row-qty" placeholder="1"></td>
              <td><input type="text" class="row-item" placeholder="Item Name"></td>
              <td><input type="text" class="row-serial" placeholder="S/N"></td>
              <td><input type="text" class="row-remarks" placeholder="Remarks"></td>
            </tr>
          </tbody>
        </table>
      </div>
      
      <button type="button" class="btn-add" onclick="addNewRow()">+ Add Row</button>
      <button type="submit" id="submitBtn" class="btn-submit">Generate Transmittal Document</button>
    </form>

    <div id="statusBox" class="status-msg"></div>
  </div>

  <script>
    // Paki-automatic select ang petsa ngayon sa pagbukas ng app
    window.onload = function() {
        document.getElementById('dateField').value = new Date().toISOString().split('T')[0];
    };

    function addNewRow() {
      const tbody = document.querySelector("#itemsTable tbody");
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><input type="text" class="row-user" placeholder="User"></td>
        <td><input type="number" class="row-qty" placeholder="1"></td>
        <td><input type="text" class="row-item" placeholder="Item Name"></td>
        <td><input type="text" class="row-serial" placeholder="S/N"></td>
        <td><input type="text" class="row-remarks" placeholder="Remarks"></td>
      `;
      tbody.appendChild(tr);
    }

    // IPALIT ANG IYONG WEB APP URL MULA SA DEPLOYMENT NG IYONG GOOGLE SCRIPT DITO
    const googleSheetUrl = "https://script.google.com/macros/s/AKfycbzCAwuBShbAb3Bf3SA_vDq7hli7x74UhQcStV2w0FM5bhnd-yu50giTkaTe_cfblbyLxQ/exec";

    function submitForm(event) {
      event.preventDefault();
      
      const submitBtn = document.getElementById("submitBtn");
      const statusBox = document.getElementById("statusBox");
      
      submitBtn.disabled = true;
      submitBtn.innerText = "Isinusumite at Ginagawa ang Google Doc...";
      statusBox.style.display = "none";

      // Paglikom ng mga aytem mula sa dinamikong talahanayan
      const rows = document.querySelectorAll("#itemsTable tbody tr");
      const itemsList = [];
      
      rows.forEach(row => {
        const itemVal = row.querySelector(".row-item").value.trim();
        if (itemVal) {
          itemsList.push({
            user: row.querySelector(".row-user").value.trim(),
            qty: row.querySelector(".row-qty").value || "1",
            item: itemVal,
            serial: row.querySelector(".row-serial").value.trim(),
            remarks: row.querySelector(".row-remarks").value.trim()
          });
        }
      });

      // Pagbuo ng Parameters para basahin ng doPost(e) function ng Google Apps Script
      const params = new URLSearchParams();
      params.append('poNum', document.getElementById("poNum").value);
      params.append('dateField', document.getElementById("dateField").value);
      params.append('fromField', document.getElementById("fromField").value);
      params.append('toField', document.getElementById("toField").value);
      params.append('coField', document.getElementById("coField").value);
      params.append('preparedBy', document.getElementById("preparedBy").value);
      params.append('itemsJson', JSON.stringify(itemsList)); // Pinapasa bilang malinis na JSON text string

      // Direktang itatapon sa Google Web App URL upang maiproseso ang DocumentApp
      fetch(googleSheetUrl, {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: params.toString()
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === "SUCCESS") {
          statusBox.className = "status-msg success";
          statusBox.innerHTML = `🔥 Matagumpay na nagawa ang Transmittal!<br><br><a href="${data.url}" target="_blank">👉 I-CLICK DITO PARA BUKSAN ANG GOOGLE DOCS REPORT 👈</a>`;
          statusBox.style.display = "block";
          document.getElementById("transmittalForm").reset();
          document.getElementById('dateField').value = new Date().toISOString().split('T')[0];
        } else {
          statusBox.className = "status-msg error";
          statusBox.innerText = "Error sa Server: " + data.message;
          statusBox.style.display = "block";
        }
        submitBtn.disabled = false;
        submitBtn.innerText = "Generate Transmittal Document";
      })
      .catch(error => {
        statusBox.className = "status-msg error";
